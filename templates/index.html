<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1>QR Code Generator</h1>
  </header>

  <main class="app-main">

    <section class="panel panel--form">

      <div class="type-tabs" role="tablist" aria-label="QR code type">
        <button type="button" class="type-tab is-active" data-type="url" role="tab" aria-selected="true">Website URL</button>
        <button type="button" class="type-tab" data-type="text" role="tab" aria-selected="false">Text</button>
        <button type="button" class="type-tab" data-type="email" role="tab" aria-selected="false">Email</button>
        <button type="button" class="type-tab" data-type="phone" role="tab" aria-selected="false">Phone</button>
        <button type="button" class="type-tab" data-type="wifi" role="tab" aria-selected="false">Wi-Fi</button>
        <button type="button" class="type-tab" data-type="image" role="tab" aria-selected="false">Image</button>
      </div>

      <div class="fields">

        <!-- URL -->
        <div class="field-group" data-fields="url">
          <label for="f-url">Website URL</label>
          <input type="text" id="f-url" placeholder="example.com or https://example.com">
        </div>

        <!-- Text -->
        <div class="field-group" data-fields="text" hidden>
          <label for="f-text">Text</label>
          <textarea id="f-text" rows="4" maxlength="2000" placeholder="Type anything you want to encode"></textarea>
        </div>

        <!-- Email -->
        <div class="field-group" data-fields="email" hidden>
          <label for="f-email-to">Email address</label>
          <input type="email" id="f-email-to" placeholder="name@example.com">

          <label for="f-email-subject">Subject <span class="optional">(optional)</span></label>
          <input type="text" id="f-email-subject" placeholder="Subject line">

          <label for="f-email-body">Message <span class="optional">(optional)</span></label>
          <textarea id="f-email-body" rows="2" placeholder="Message body"></textarea>
        </div>

        <!-- Phone -->
        <div class="field-group" data-fields="phone" hidden>
          <label for="f-phone">Phone number</label>
          <input type="tel" id="f-phone" placeholder="+1 555 123 4567">
        </div>

        <!-- Wi-Fi -->
        <div class="field-group" data-fields="wifi" hidden>
          <label for="f-wifi-ssid">Network name (SSID)</label>
          <input type="text" id="f-wifi-ssid" placeholder="My Wi-Fi network">

          <label for="f-wifi-security">Security</label>
          <select id="f-wifi-security">
            <option value="WPA">WPA / WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">None</option>
          </select>

          <label for="f-wifi-password">Password</label>
          <input type="text" id="f-wifi-password" placeholder="Network password">

          <label class="checkbox-label">
            <input type="checkbox" id="f-wifi-hidden">
            Hidden network
          </label>
        </div>

        <!-- Image -->
        <div class="field-group" data-fields="image" hidden>
          <label for="f-image">Image file (JPG, JPEG, PNG)</label>
          <input type="file" id="f-image" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
          <p class="field-hint">QR codes can only hold about 2KB of data, so only very small images will fit.</p>
          <p class="file-name" id="fileName"></p>
        </div>

      </div>

      <p class="error-message" id="errorMessage" hidden></p>

      <div class="form-actions">
        <button type="button" class="btn btn--ghost" id="clearBtn">Clear</button>
        <button type="button" class="btn btn--ghost" id="copyBtn">Copy content</button>
      </div>

    </section>

    <section class="panel panel--preview">
      <div class="qr-box" id="qrBox">
        <p class="qr-placeholder" id="qrPlaceholder">Your QR code will appear here</p>
        <img id="qrImage" class="qr-image" alt="Generated QR code" hidden>
      </div>

      <div class="download-actions">
        <button type="button" class="btn btn--primary" id="downloadPngBtn" disabled>Download PNG</button>
        <button type="button" class="btn btn--secondary" id="downloadSvgBtn" disabled>Download SVG</button>
      </div>
    </section>

  </main>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
